cv:
  name: "Luis Andrés Alemán Sánchez"
  headline: Ingeniero de Sistemas Robóticos | Firmware Embebido | Automatización Industrial
  location: León, GTO, México
  email: "andresaleman142@gmail.com"
  website: "https://andresalemn.github.io"

  sections:
    Perfil Profesional:
      - |
        Ingeniero de sistemas robóticos integrando firmware embebido, teoría de
        control y automatización industrial, con capacidad para trabajar de
        extremo a extremo, desde la puesta en marcha mecánica y eléctrica hasta
        bucles de control en C++ en tiempo real. Dos años de experiencia
        desarrollando controladores de torque y posición, redes de actuadores
        distribuidos mediante CAN/CANopen y sistemas robóticos basados en ROS 2,
        además de automatización con PLC y neumática para clientes industriales.
        Español nativo, inglés profesional (C1).

    Experiencia:
      - company: "Inbiodroid"
        position: "Ingeniero de Control y Robótica Jr."
        location: "León, Guanajuato, Mexico"
        start_date: "2024-05"
        end_date: "present"
        highlights:
          - Desarrollé controladores articulares basados en torque en C++ para una
            [plataforma de investigación humanoide de 20 GDL](https://andresalemn.github.io/projects/pr3.html),
            logrando una precisión de posicionamiento submilimétrica mediante
            retroalimentación de encoders y algoritmos de control propios ejecutados
            en tiempo real.
          - Desarrollé e implementé firmware embebido en microcontroladores Teensy 4.1
            y ESP32 en una red distribuida de actuadores CAN/CANopen, abarcando
            control de movimiento en tiempo real, monitoreo de seguridad y rutinas
            de homing automatizadas.
          - >
            Traduje investigaciones de dinámica y cinemática en controladores
            personalizados de torque y cinemática inversa para teleoperación en
            tiempo real, integrando captura de movimiento basada en IMU sobre una
            capa existente de comunicación UDP.
          - Lideré la integración, calibración y depuración de sistemas abarcando
            hardware y software robótico, además de lógica de control PLC (Siemens
            LOGO!) y diseño eléctrico/neumático para proyectos de automatización
            industrial.

    Proyectos:
      - name: "[3-DOF DC Motor Manipulator](https://andresalemn.github.io/projects/uni-manipulator.html)"
        summary: "University Project"
        highlights:
          - Diseñé e implementé firmware embebido de control de motores en C++
            para un manipulador robótico de 3 grados de libertad.
          - Integré encoders incrementales y ajusté controladores PID para lograr
            una precisión de posicionamiento de ±1 mm.
          - Desarrollé una interfaz de comunicación serial entre el controlador
            embebido y una aplicación en Python para monitoreo y control.

      - name: "[Alexa-Controlled Robot (ROS 2 + Flask)](https://andresalemn.github.io/projects/aurduino-bot.html)"
        summary: "Personal Project"
        highlights:
          - Desarrollé un sistema de control robótico basado en ROS 2 integrando
            comandos de voz de Amazon Alexa mediante un servicio web Flask y
            comunicación segura mediante túneles.
          - Implementé nodos ROS 2, gestión de ciclo de vida e interfaces
            ros2_control para accionamiento de servos en tiempo real y
            retroalimentación de estado.
          - Diseñé APIs y flujos de comunicación entre servicios en la nube y
            hardware robótico físico.

      - name: "Blind Spot Detection System"
        summary: "Bachelor's Capstone Project"
        highlights:
          - Desarrollé un prototipo de asistencia al conductor basado en Raspberry Pi
            utilizando Python, OpenCV y sensores ultrasónicos.
          - Implementé técnicas de procesamiento de señales y filtrado digital para
            mejorar la robustez de detección de obstáculos y reducir ruido del sensor.
          - Integré módulos de visión computacional y medición de distancia en una
            aplicación embebida única.

