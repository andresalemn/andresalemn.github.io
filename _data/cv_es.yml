        location: "León, Guanajuato, Mexico"
        start_date: "2024-05"
        end_date: "present"
        highlights:
          - Desarrollé controladores de posición articular basados en torque en C++
            para múltiples subsistemas de un robot humanoide de 20 grados de libertad,
            logrando una precisión de posicionamiento submilimétrica (inferior a 1 mm)
            mediante retroalimentación de encoders y algoritmos de control propios.
          - Implementé firmware embebido en microcontroladores Teensy 4.1 e integré
            nodos distribuidos de control de movimiento mediante el protocolo CANopen.
          - >
            Diseñé y probé funcionalidades de teleoperación en tiempo real mediante
            la integración de sensores IMU, cinemática inversa y comunicación basada
            en UDP entre subsistemas robóticos.
          - Realicé integración de sistemas, depuración, calibración y validación
            de componentes de hardware y software robótico durante el desarrollo
            de prototipos.
          - Desarrollé lógica de control PLC con Siemens LOGO!, elaboré diagramas
            eléctricos en SolidWorks Electrical y diseñé circuitos neumáticos en
            FluidSIM para proyectos de automatización industrial.

    Proyectos:
      - name: "[3-DOF DC Motor Manipulator](https://andresalemn.github.io/projects/uni-manipulator.html)"
        summary: "University Project"
        highlights:
          - Diseñé e implementé firmware embebido de control de motores en C++
            para un manipulador robótico de 3 grados de libertad.
          - Integré encoders incrementales y ajusté controladores PID para lograr
            una precisión de posicionamiento de ±1 mm.
          - Desarrollé una interfaz de comunicación serial entre el controlador
            embebido y una aplicación en Python para monitoreo y control.

      - name: "[Alexa-Controlled Robot (ROS 2 + Flask)](https://andresalemn.github.io/projects/aurduino-bot.html)"
        summary: "Personal Project"
        highlights:
          - Desarrollé un sistema de control robótico basado en ROS 2 integrando
            comandos de voz de Amazon Alexa mediante un servicio web Flask y
            comunicación segura mediante túneles.
          - Implementé nodos ROS 2, gestión de ciclo de vida e interfaces
            ros2_control para accionamiento de servos en tiempo real y
            retroalimentación de estado.
          - Diseñé APIs y flujos de comunicación entre servicios en la nube y
            hardware robótico físico.

      - name: "Blind Spot Detection System"
        summary: "Bachelor's Capstone Project"
        highlights:
          - Desarrollé un prototipo de asistencia al conductor basado en Raspberry Pi
            utilizando Python, OpenCV y sensores ultrasónicos.
          - Implementé técnicas de procesamiento de señales y filtrado digital para
            mejorar la robustez de detección de obstáculos y reducir ruido del sensor.
          - Integré módulos de visión computacional y medición de distancia en una
            aplicación embebida única.

